[advisories]
ignore = ["RUSTSEC-2023-0071"]

[bans]
multiple-versions = "warn"
# The private file_identity crate is intentionally a path dependency and is not
# published. Keep the cargo-deny diagnostic visible without treating this
# repository-local edge as an external version drift.
wildcards = "warn"

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "LGPL-2.1-or-later",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8
private = { ignore = true }

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
