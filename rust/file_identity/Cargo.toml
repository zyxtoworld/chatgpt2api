[package]
name = "chatgpt2api-file-identity"
version = "0.1.0"
edition = "2024"
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.30.1", features = ["fs"] }
