name: Rust Canary

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - ".github/workflows/rust-canary.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-canary.yml"
  workflow_dispatch:

jobs:
  rust:
    name: fmt-clippy-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: rust
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --locked --all-targets
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked --all-targets
