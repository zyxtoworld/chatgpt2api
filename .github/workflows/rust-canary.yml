name: Rust Canary

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "scripts/install_pinned_openssl.sh"
      - ".github/workflows/rust-canary.yml"
  pull_request:
    paths:
      - "rust/**"
      - "scripts/install_pinned_openssl.sh"
      - ".github/workflows/rust-canary.yml"
  workflow_dispatch:

jobs:
  rust:
    name: fmt-clippy-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - name: Cache
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: rust
      - name: Install Python and uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true
      - name: Install Python dependencies
        run: |
          uv python install 3.13
          uv sync --frozen --all-groups --no-install-project
        working-directory: .
      - name: Install pinned OpenSSL
        run: bash scripts/install_pinned_openssl.sh
        working-directory: .
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check
        run: cargo check --workspace --locked --all-targets
      - name: Clippy
        run: cargo clippy --workspace --locked --all-targets -- -D warnings
      - name: Tests
        env:
          CHATGPT2API_TEST_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: cargo test --workspace --locked --all-targets
